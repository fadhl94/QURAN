<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>متابع حفظ القرآن الكريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0f3d2e; --primary-2:#1b5e47; --accent:#2d8a66; --gold:#c9a24b; --gold-soft:#f3e6c4;
  --bg:#f4f6f3; --card:#ffffff; --text:#1c2a24; --muted:#6b7c74; --border:#e3e9e5;
  --danger:#c0392b; --shadow:0 6px 20px rgba(15,61,46,.08); --reader-size:1.7rem;
}
[data-theme="dark"]{
  --primary:#0b2a20; --primary-2:#12402f; --accent:#3fae84; --gold:#d9b45c; --gold-soft:#3a3320;
  --bg:#0d1512; --card:#15211c; --text:#e6efe9; --muted:#8fa399; --border:#223229;
  --danger:#e5604f; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;transition:background .3s,color .3s;
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:0 16px 96px}

/* ---------- Header ---------- */
.hero{background:linear-gradient(160deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff;
  margin:0 -16px;padding:calc(env(safe-area-inset-top) + 18px) 20px 70px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border:1.5px solid rgba(255,255,255,.08);border-radius:50%}
.hero::before{width:260px;height:260px;top:-110px;left:-70px}
.hero::after{width:180px;height:180px;bottom:-90px;right:-40px}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hero h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:.2px}
.hero p{margin:4px 0 0;font-size:.85rem;opacity:.8}
.icon-btn{background:rgba(255,255,255,.14);border:none;color:#fff;width:40px;height:40px;border-radius:12px;font-size:1.1rem;
  display:inline-flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.icon-btn:hover{background:rgba(255,255,255,.25)}
.icon-btn:active{transform:scale(.92)}

/* ---------- Progress card ---------- */
.progress-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-top:-48px;position:relative;z-index:2;
  display:flex;align-items:center;gap:18px;border:1px solid var(--border)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--border) 0);transition:background .5s}
.ring-inner{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:var(--primary-2)}
[data-theme="dark"] .ring-inner{color:var(--accent)}
.stats{flex:1;min-width:0}
.stats .big{font-size:1.5rem;font-weight:800;line-height:1.2}
.stats .big small{font-size:.95rem;font-weight:500;color:var(--muted)}
.stats .sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.bar{height:8px;background:var(--border);border-radius:99px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .5s}

/* ---------- Toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;margin-top:6px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:14px;
  padding:13px 44px 13px 14px;font-family:inherit;font-size:1rem;outline:none;transition:border .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,138,102,.18)}
.search span{position:absolute;right:15px;top:50%;transform:translateY(-50%);opacity:.55}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:12px;padding:9px 6px;font-size:.9rem;font-weight:500;transition:all .2s}
.tab.active{background:var(--primary-2);border-color:var(--primary-2);color:#fff;font-weight:700}
.tab b{font-weight:700;margin-inline-start:4px;opacity:.85}

/* ---------- Surah list ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.surah{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;animation:fade .3s ease both}
.surah:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.surah.done{border-color:rgba(45,138,102,.45);background:linear-gradient(90deg,rgba(45,138,102,.08),var(--card))}
.num{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:var(--primary-2);position:relative}
[data-theme="dark"] .num{color:var(--accent)}
.num::before{content:"";position:absolute;inset:3px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:10px;transform:rotate(45deg)}
.num span{position:relative}
.s-info{flex:1;min-width:0}
.s-name{font-family:'Amiri',serif;font-size:1.3rem;font-weight:700;line-height:1.4}
.s-meta{font-size:.78rem;color:var(--muted)}
.check{width:42px;height:42px;border-radius:12px;border:2px solid var(--border);background:transparent;color:transparent;font-size:1.2rem;font-weight:800;
  display:grid;place-items:center;transition:all .2s;flex-shrink:0}
.check:hover{border-color:var(--accent)}
.surah.done .check{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .e-ico{font-size:2.4rem;margin-bottom:6px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Reader ---------- */
#readerView{display:none}
.reader-bar{position:sticky;top:0;z-index:30;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--primary);color:#fff;
  display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.reader-bar h2{flex:1;margin:0;text-align:center;font-family:'Amiri',serif;font-size:1.5rem}
.reader-bar .icon-btn{width:38px;height:38px;font-size:1rem;font-weight:700}
.reader-card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);margin-top:16px;padding:22px 18px}
.s-banner{border:2px solid var(--gold);border-radius:14px;padding:10px;text-align:center;margin-bottom:18px;background:var(--gold-soft);position:relative}
.s-banner::after{content:"";position:absolute;inset:4px;border:1px solid var(--gold);border-radius:10px;opacity:.5;pointer-events:none}
.s-banner b{font-family:'Amiri',serif;font-size:1.5rem;color:var(--text)}
.s-banner small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.bismillah{text-align:center;font-family:'Amiri Quran','Amiri',serif;font-size:calc(var(--reader-size) + .15rem);color:var(--accent);margin:6px 0 18px;line-height:2}
.verses{font-family:'Amiri Quran','Amiri',serif;font-size:var(--reader-size);line-height:2.6;text-align:justify;text-align-last:center;direction:rtl;word-spacing:2px}
.ayah-no{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;margin:0 4px;padding:0 3px;border:1.5px solid var(--gold);color:var(--accent);
  border-radius:50%;font-family:'Tajawal',sans-serif;font-size:.5em;font-weight:700;vertical-align:middle;background:var(--gold-soft)}
.loading,.error{text-align:center;color:var(--muted);padding:40px 10px;font-family:'Tajawal',sans-serif;font-size:1rem;line-height:1.8}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry{margin-top:10px;background:var(--accent);color:#fff;border:none;padding:9px 20px;border-radius:10px;font-size:.95rem}
.reader-actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);padding:13px 10px;border-radius:14px;font-size:.95rem;font-weight:700;transition:all .2s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.92;color:#fff}
.btn.undo{background:transparent;color:var(--danger);border-color:var(--danger)}

/* ---------- Misc ---------- */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translate(-50%,30px);background:var(--primary);color:#fff;padding:11px 20px;border-radius:99px;
  font-size:.92rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:all .3s;z-index:100;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.install{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);right:16px;display:none;align-items:center;gap:8px;background:var(--gold);color:#2b2108;border:none;
  border-radius:99px;padding:12px 18px;font-weight:800;font-size:.95rem;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:90}
.to-top{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);left:16px;width:46px;height:46px;border-radius:50%;border:none;background:var(--primary-2);color:#fff;
  font-size:1.2rem;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none;z-index:80}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ============ الصفحة الرئيسية ============ -->
  <div id="mainView">
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>📖 متابع حفظ القرآن الكريم</h1>
          <p>«وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ»</p>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي">🌙</button>
      </div>
    </header>

    <section class="progress-card" aria-label="التقدم">
      <div class="ring" id="ring"><div class="ring-inner" id="ringText">٠٪</div></div>
      <div class="stats">
        <div class="big" id="countBig">٠ <small>من ١١٤ سورة</small></div>
        <div class="sub" id="versesSub">٠ آية محفوظة من ٦٬٢٣٦</div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </section>

    <div class="toolbar">
      <div class="search">
        <span>🔍</span>
        <input id="search" type="search" placeholder="ابحث باسم السورة أو رقمها..." autocomplete="off">
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-f="all">الكل<b id="cAll"></b></button>
        <button class="tab" data-f="todo">غير محفوظة<b id="cTodo"></b></button>
        <button class="tab" data-f="done">محفوظة<b id="cDone"></b></button>
      </div>
    </div>

    <div class="list" id="list"></div>
  </div>

  <!-- ============ صفحة القراءة ============ -->
  <div id="readerView">
    <div class="reader-bar">
      <button class="icon-btn" id="backBtn" aria-label="رجوع">➜</button>
      <h2 id="readerTitle">سورة</h2>
      <button class="icon-btn" id="fontMinus" aria-label="تصغير الخط">أ-</button>
      <button class="icon-btn" id="fontPlus" aria-label="تكبير الخط">أ+</button>
    </div>
    <div class="reader-card">
      <div class="s-banner"><b id="bannerName"></b><small id="bannerMeta"></small></div>
      <div id="bismillah"></div>
      <div class="verses" id="verses"></div>
    </div>
    <div class="reader-actions">
      <button class="btn" id="nextBtn">‹ السورة التالية</button>
      <button class="btn primary" id="markBtn">تم الحفظ ✓</button>
      <button class="btn" id="prevBtn">السورة السابقة ›</button>
    </div>
  </div>
</div>

<button class="install" id="installBtn">📥 تثبيت التطبيق</button>
<button class="to-top" id="toTop" aria-label="للأعلى">↑</button>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= البيانات ================= */
const SURAHS = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const VERSES = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const TOTAL_VERSES = VERSES.reduce((a, b) => a + b, 0);
const BISMILLAH = "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ";
const BISM_WORDS = ["بسم", "الله", "الرحمن", "الرحيم"];

/* ================= أدوات ================= */
const $ = id => document.getElementById(id);
const ar = n => Number(n).toLocaleString('ar-EG');
const norm = s => s
  .replace(/[\u0640\u064B-\u065F\u0670\u06D6-\u06ED\uFEFF\u200C\u200D]/g, '')
  .replace(/[ٱأإآ]/g, 'ا').replace(/[یى]/g, 'ي').replace(/ة/g, 'ه').trim();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};

/* ================= الحالة ================= */
let memorized = new Set((store.get('memorizedSurahs', []) || []).filter(n => Number.isInteger(n) && n >= 1 && n <= 114));
let filter = 'all';
let query = '';
let currentId = null;
let loadToken = 0;
let fontSize = store.get('readerFontSize', 1.7);

/* ================= السمة ================= */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0b2a20' : '#0f3d2e';
}
applyTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('themeBtn').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
};

/* ================= Toast ================= */
let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* ================= الرئيسية ================= */
function save() { store.set('memorizedSurahs', [...memorized].sort((a, b) => a - b)); }

function toggle(id) {
  if (memorized.has(id)) { memorized.delete(id); toast(`أُلغي حفظ سورة ${SURAHS[id - 1]}`); }
  else { memorized.add(id); toast(`ما شاء الله! تم حفظ سورة ${SURAHS[id - 1]} ✨`); }
  save(); renderStats(); renderList(false);
  if (currentId === id) updateMarkBtn();
}

function renderStats() {
  const n = memorized.size;
  const pct = Math.round(n / 114 * 100);
  let v = 0; memorized.forEach(id => v += VERSES[id - 1]);
  $('ring').style.setProperty('--p', pct);
  $('ringText').textContent = ar(pct) + '٪';
  $('countBig').innerHTML = `${ar(n)} <small>من ${ar(114)} سورة</small>`;
  $('versesSub').textContent = `${ar(v)} آية محفوظة من ${ar(TOTAL_VERSES)}`;
  $('barFill').style.width = (v / TOTAL_VERSES * 100) + '%';
  $('cAll').textContent = `(${ar(114)})`;
  $('cDone').textContent = `(${ar(n)})`;
  $('cTodo').textContent = `(${ar(114 - n)})`;
}

function renderList(animate = true) {
  const q = norm(query);
  const list = $('list');
  const frag = document.createDocumentFragment();
  let count = 0;
  SURAHS.forEach((name, i) => {
    const id = i + 1, done = memorized.has(id);
    if (filter === 'done' && !done) return;
    if (filter === 'todo' && done) return;
    if (q && !norm(name).includes(q) && String(id) !== q && ar(id) !== q) return;
    count++;
    const row = document.createElement('div');
    row.className = 'surah' + (done ? ' done' : '');
    row.dataset.id = id;
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    if (!animate) row.style.animation = 'none';
    else row.style.animationDelay = Math.min(count * 15, 300) + 'ms';
    row.innerHTML = `
      <div class="num"><span>${ar(id)}</span></div>
      <div class="s-info"><div class="s-name"></div><div class="s-meta">${ar(VERSES[i])} آية</div></div>
      <button class="check" data-act="toggle" aria-label="${done ? 'إلغاء الحفظ' : 'تم الحفظ'}">✓</button>`;
    row.querySelector('.s-name').textContent = 'سورة ' + name;
    frag.appendChild(row);
  });
  list.replaceChildren(frag);
  if (!count) {
    list.innerHTML = `<div class="empty"><div class="e-ico">${filter === 'done' ? '🌱' : '🔎'}</div>${
      filter === 'done' && !q ? 'لم تحدد أي سورة كمحفوظة بعد' : 'لا توجد نتائج مطابقة'}</div>`;
  }
}

$('list').addEventListener('click', e => {
  const row = e.target.closest('.surah'); if (!row) return;
  const id = +row.dataset.id;
  if (e.target.closest('[data-act="toggle"]')) { toggle(id); return; }
  openSurah(id);
});
$('list').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('surah')) { e.preventDefault(); openSurah(+e.target.dataset.id); }
});
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  filter = t.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  renderList();
});
let st;
$('search').addEventListener('input', e => { clearTimeout(st); st = setTimeout(() => { query = e.target.value; renderList(false); }, 120); });

/* ================= القراءة ================= */
function cleanAyahs(id, ayahs) {
  // يعيد [{n, t}] بعد إزالة البسملة المدمجة في الآية الأولى (ما عدا الفاتحة حيث هي آية مستقلة)
  return ayahs.map((a, idx) => {
    let t = String(a.text || '');
    if (idx === 0 && id !== 1 && id !== 9) {
      const toks = t.match(/\S+\s*/g) || [];
      if (toks.length >= 4 && BISM_WORDS.every((w, k) => norm(toks[k]) === w)) {
