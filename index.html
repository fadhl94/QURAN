<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="القرآن">
<link rel="icon" type="image/png" id="favIcon">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="manifest" id="manifestLink">
<title>متابع حفظ القرآن الكريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0f3d2e; --primary-2:#1b5e47; --accent:#2d8a66; --gold:#c9a24b; --gold-soft:#f3e6c4;
  --bg:#f4f6f3; --card:#ffffff; --text:#1c2a24; --muted:#6b7c74; --border:#e3e9e5;
  --danger:#c0392b; --shadow:0 6px 20px rgba(15,61,46,.08); --reader-size:1.7rem;
}
[data-theme="dark"]{
  --primary:#0b2a20; --primary-2:#12402f; --accent:#3fae84; --gold:#d9b45c; --gold-soft:#3a3320;
  --bg:#0d1512; --card:#15211c; --text:#e6efe9; --muted:#8fa399; --border:#223229;
  --danger:#e5604f; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;transition:background .3s,color .3s;
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:0 16px 96px}

/* ---------- Header ---------- */
.hero{background:linear-gradient(160deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff;
  margin:0 -16px;padding:calc(env(safe-area-inset-top) + 18px) 20px 70px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border:1.5px solid rgba(255,255,255,.08);border-radius:50%}
.hero::before{width:260px;height:260px;top:-110px;left:-70px}
.hero::after{width:180px;height:180px;bottom:-90px;right:-40px}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hero-btns{display:flex;gap:8px}
.hero h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:.2px}
.hero p{margin:4px 0 0;font-size:.85rem;opacity:.8}
.icon-btn{background:rgba(255,255,255,.14);border:none;color:#fff;width:40px;height:40px;border-radius:12px;font-size:1.1rem;
  display:inline-flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.icon-btn:hover{background:rgba(255,255,255,.25)}
.icon-btn:active{transform:scale(.92)}

/* ---------- Progress card ---------- */
.progress-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-top:-48px;position:relative;z-index:2;
  display:flex;align-items:center;gap:18px;border:1px solid var(--border)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--border) 0);transition:background .5s}
.ring-inner{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:var(--primary-2)}
[data-theme="dark"] .ring-inner{color:var(--accent)}
.stats{flex:1;min-width:0}
.stats .big{font-size:1.5rem;font-weight:800;line-height:1.2}
.stats .big small{font-size:.95rem;font-weight:500;color:var(--muted)}
.stats .sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.bar{height:8px;background:var(--border);border-radius:99px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .5s}

/* ---------- Toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;margin-top:6px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:14px;
  padding:13px 44px 13px 14px;font-family:inherit;font-size:1rem;outline:none;transition:border .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,138,102,.18)}
.search span{position:absolute;right:15px;top:50%;transform:translateY(-50%);opacity:.55}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:12px;padding:9px 6px;font-size:.9rem;font-weight:500;transition:all .2s}
.tab.active{background:var(--primary-2);border-color:var(--primary-2);color:#fff;font-weight:700}
.tab b{font-weight:700;margin-inline-start:4px;opacity:.85}

/* ---------- Surah list ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.surah{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;animation:fade .3s ease both}
.surah:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.surah.done{border-color:rgba(45,138,102,.45);background:linear-gradient(90deg,rgba(45,138,102,.08),var(--card))}
.num{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:var(--primary-2);position:relative}
[data-theme="dark"] .num{color:var(--accent)}
.num::before{content:"";position:absolute;inset:3px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:10px;transform:rotate(45deg)}
.num span{position:relative}
.s-info{flex:1;min-width:0}
.s-name{font-family:'Amiri',serif;font-size:1.3rem;font-weight:700;line-height:1.4}
.s-meta{font-size:.78rem;color:var(--muted)}
.check{width:42px;height:42px;border-radius:12px;border:2px solid var(--border);background:transparent;color:transparent;font-size:1.2rem;font-weight:800;
  display:grid;place-items:center;transition:all .2s;flex-shrink:0}
.check:hover{border-color:var(--accent)}
.surah.done .check{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .e-ico{font-size:2.4rem;margin-bottom:6px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Reader ---------- */
#readerView{display:none}
.reader-bar{position:sticky;top:0;z-index:30;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--primary);color:#fff;
  display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.reader-bar h2{flex:1;margin:0;text-align:center;font-family:'Amiri',serif;font-size:1.5rem}
.reader-bar .icon-btn{width:38px;height:38px;font-size:1rem;font-weight:700}
.reader-card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);margin-top:16px;padding:22px 18px}
.s-banner{border:2px solid var(--gold);border-radius:14px;padding:10px;text-align:center;margin-bottom:18px;background:var(--gold-soft);position:relative}
.s-banner::after{content:"";position:absolute;inset:4px;border:1px solid var(--gold);border-radius:10px;opacity:.5;pointer-events:none}
.s-banner b{font-family:'Amiri',serif;font-size:1.5rem;color:var(--text)}
.s-banner small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.bismillah{text-align:center;font-family:'Amiri Quran','Amiri',serif;font-size:calc(var(--reader-size) + .15rem);color:var(--accent);margin:6px 0 18px;line-height:2}
.verses{font-family:'Amiri Quran','Amiri',serif;font-size:var(--reader-size);line-height:2.6;text-align:justify;text-align-last:center;direction:rtl;word-spacing:2px}
.ayah-no{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;margin:0 4px;padding:0 3px;border:1.5px solid var(--gold);color:var(--accent);
  border-radius:50%;font-family:'Tajawal',sans-serif;font-size:.5em;font-weight:700;vertical-align:middle;background:var(--gold-soft)}
.loading,.error{text-align:center;color:var(--muted);padding:40px 10px;font-family:'Tajawal',sans-serif;font-size:1rem;line-height:1.8}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry{margin-top:10px;background:var(--accent);color:#fff;border:none;padding:9px 20px;border-radius:10px;font-size:.95rem}
.reader-actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);padding:13px 10px;border-radius:14px;font-size:.95rem;font-weight:700;transition:all .2s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.92;color:#fff}
.btn.undo{background:transparent;color:var(--danger);border-color:var(--danger)}

/* ---------- Audio player ---------- */
.player{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);margin-top:16px;padding:14px 16px 12px}
.p-top{display:flex;align-items:center;gap:12px}
.play{width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.35rem;display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 6px 16px rgba(45,138,102,.35);transition:transform .15s}
.play:active{transform:scale(.93)}
.play.busy{animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.55}}
.p-info{flex:1;min-width:0}
.p-title{font-weight:700;font-size:1rem}
.p-reciter{background:none;border:none;color:var(--muted);font-size:.85rem;padding:2px 0;text-align:right;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:1.15rem;flex-shrink:0;opacity:.7}
.rep.on{background:var(--gold-soft);border-color:var(--gold);color:var(--accent);opacity:1}
#seek{-webkit-appearance:none;appearance:none;display:block;width:100%;height:8px;border-radius:99px;outline:none;margin:16px 0 8px;cursor:pointer;
  background:linear-gradient(to left,var(--accent) var(--v,0%),var(--border) var(--v,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--gold);border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.3)}
#seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.times{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.times span{direction:ltr;unicode-bidi:isolate}

/* ---------- Misc ---------- */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translate(-50%,30px);background:var(--primary);color:#fff;padding:11px 20px;border-radius:99px;
  font-size:.92rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:all .3s;z-index:300;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.install{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);right:16px;display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#e0b95c,#c9a24b);color:#2b2108;border:none;
  border-radius:99px;padding:7px 18px 7px 8px;font-weight:800;font-size:.95rem;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:90;animation:pulse 2.4s ease-in-out infinite}
.install img{width:36px;height:36px;border-radius:10px;display:block}
.install:active{transform:scale(.96)}
@keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.3),0 0 0 0 rgba(201,162,75,.55)}50%{box-shadow:0 8px 22px rgba(0,0,0,.3),0 0 0 10px rgba(201,162,75,0)}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:200}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .s-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet .s-head img{width:56px;height:56px;border-radius:14px;box-shadow:var(--shadow)}
.sheet h3{margin:0;font-size:1.1rem}
.sheet .s-sub{color:var(--muted);font-size:.85rem}
.sheet ol{margin:0 0 14px;padding:0 20px 0 0;line-height:2;font-size:.98rem}
.sheet .btn{width:100%}
#recList{max-height:52vh;overflow:auto;margin-bottom:12px}
.rec{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;font-size:1rem;text-align:right}
.rec.sel{border-color:var(--accent);background:rgba(45,138,102,.1);font-weight:700}
.rec i{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.rec.sel i{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.to-top{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);left:16px;width:46px;height:46px;border-radius:50%;border:none;background:var(--primary-2);color:#fff;
  font-size:1.2rem;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none;z-index:80}
/* ---------- وضع التلفاز (Android TV) ---------- */
html.tv{font-size:22px}
.tv .app{max-width:1280px;padding:0 40px 80px}
.tv .hero,.tv .reader-bar{margin:0 -40px;padding-left:40px;padding-right:40px}
.tv .hero{padding-top:calc(env(safe-area-inset-top) + 34px)}
.tv .reader-bar{padding-top:20px;padding-bottom:16px}
.tv .list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tv .icon-btn,.tv .reader-bar .icon-btn{width:56px;height:56px;font-size:1.3rem;border-radius:16px}
.tv .check{width:56px;height:56px}
.tv .num{width:56px;height:56px}
.tv .play{width:76px;height:76px}
.tv .rep{width:60px;height:60px}
.tv .tab{padding:14px 8px}
.tv .search input{padding:16px 48px 16px 16px;font-size:1.1rem}
.tv .btn{padding:18px 12px;font-size:1.05rem}
.tv .verses{line-height:2.4}
.tv .toast{font-size:1.1rem;padding:16px 32px}
.tv .sheet-bg{align-items:center}
.tv .sheet{max-width:760px;border-radius:24px}
.tv .install,.tv .to-top{display:none!important}
.tv button:focus,.tv input:focus,.tv .surah:focus,.tv .verses:focus{outline:4px solid var(--gold);outline-offset:3px;border-radius:14px}
.tv .surah:focus{transform:scale(1.02);border-color:var(--gold);box-shadow:var(--shadow)}
.tv .btn:focus,.tv .tab:focus,.tv .rec:focus{background:var(--gold-soft);color:#1c2a24}
.tv #seek:focus{outline-offset:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ============ الصفحة الرئيسية ============ -->
  <div id="mainView">
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>📖 متابع حفظ القرآن الكريم</h1>
          <p>«وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ»</p>
        </div>
        <div class="hero-btns">
          <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات">⚙️</button>
          <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي">🌙</button>
        </div>
      </div>
    </header>

    <section class="progress-card" aria-label="التقدم">
      <div class="ring" id="ring"><div class="ring-inner" id="ringText">٠٪</div></div>
      <div class="stats">
        <div class="big" id="countBig">٠ <small>من ١١٤ سورة</small></div>
        <div class="sub" id="versesSub">٠ آية محفوظة من ٦٬٢٣٦</div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </section>

    <div class="toolbar">
      <div class="search">
        <span>🔍</span>
        <input id="search" type="search" placeholder="ابحث باسم السورة أو رقمها..." autocomplete="off">
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-f="all">الكل<b id="cAll"></b></button>
        <button class="tab" data-f="todo">غير محفوظة<b id="cTodo"></b></button>
        <button class="tab" data-f="done">محفوظة<b id="cDone"></b></button>
      </div>
    </div>

    <div class="list" id="list"></div>
  </div>

  <!-- ============ صفحة القراءة ============ -->
  <div id="readerView">
    <div class="reader-bar">
      <button class="icon-btn" id="backBtn" aria-label="رجوع">➜</button>
      <h2 id="readerTitle">سورة</h2>
      <button class="icon-btn" id="fontMinus" aria-label="تصغير الخط">أ-</button>
      <button class="icon-btn" id="fontPlus" aria-label="تكبير الخط">أ+</button>
    </div>

    <div class="player" id="player">
      <div class="p-top">
        <button class="play" id="playBtn" aria-label="تشغيل">▶</button>
        <div class="p-info">
          <div class="p-title" id="pTitle">استماع للسورة</div>
          <button class="p-reciter" id="pReciter" aria-label="تغيير القارئ"></button>
        </div>
        <button class="rep on" id="repBtn" aria-label="تكرار السورة">🔁</button>
      </div>
      <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="شريط التقدم">
      <div class="times"><span id="tCur">٠:٠٠</span><span id="tTot">٠:٠٠</span></div>
    </div>

    <div class="reader-card">
      <div class="s-banner"><b id="bannerName"></b><small id="bannerMeta"></small></div>
      <div id="bismillah"></div>
      <div class="verses" id="verses"></div>
    </div>
    <div class="reader-actions">
      <button class="btn" id="nextBtn">‹ السورة التالية</button>
      <button class="btn primary" id="markBtn">تم الحفظ ✓</button>
      <button class="btn" id="prevBtn">السورة السابقة ›</button>
    </div>
  </div>
</div>

<audio id="audio" preload="none" playsinline></audio>

<button class="install" id="installBtn" aria-label="تثبيت التطبيق"><img id="installIcon" alt="">تثبيت التطبيق</button>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="s-head"><img id="sheetIcon" alt=""><div><h3 id="sheetTitle">تثبيت «القرآن» على هاتفك</h3><div class="s-sub">يعمل كتطبيق مستقل بأيقونته الخاصة</div></div></div>
    <ol id="sheetSteps"></ol>
    <button class="btn primary" id="sheetClose">حسنًا</button>
  </div>
</div>

<div class="sheet-bg" id="setBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="s-head"><div><h3 id="setTitle">⚙️ الإعدادات</h3><div class="s-sub">اختر القارئ الذي تريد الاستماع إليه</div></div></div>
    <button class="rec" id="tvToggle" type="button">📺 وضع التلفاز</button>
    <div id="recList"></div>
    <button class="btn primary" id="setClose">تم</button>
  </div>
</div>

<button class="to-top" id="toTop" aria-label="للأعلى">↑</button>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= الأيقونات (تُرسم برمجيًا بدون ملفات خارجية) ================= */
function makeIcon(size) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    // خلفية متدرجة تملأ المربع بالكامل (مناسبة للأيقونات القابلة للقص)
    const g = x.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#0f3d2e'); g.addColorStop(1, '#1b5e47');
    x.fillStyle = g; x.fillRect(0, 0, size, size);

function cleanAyahs(id, ayahs) {
  // يعيد [{n, t}] بعد إزالة البسملة المدمجة في الآية الأولى (ما عدا الفاتحة حيث هي آية مستقلة)
  return ayahs.map((a, idx) => {
    let t = String(a.text || '');
    if (idx === 0 && id !== 1 && id !== 9) {
      const toks = t.match(/\S+\s*/g) || [];
      if (toks.length >= 4 && BISM_WORDS.every((w, k) => norm(toks[k]) === w)) {
        t = toks.slice(4).join('').trim();
      }
    }
    return { n: a.numberInSurah, t };
  }).filter(a => a.t);
}

async function fetchSurah(id) {
  const cacheKey = 'surahText_v2_' + id;
  const cached = store.get(cacheKey, null);
  if (cached) return cached;
  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`, { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.code !== 200) throw new Error('bad response');
      const out = cleanAyahs(id, data.data.ayahs);
      store.set(cacheKey, out);   // حفظ للقراءة دون إنترنت
      return out;
    } catch (err) { lastErr = err; }
    finally { clearTimeout(timer); }
  }
  throw lastErr;
}

function openSurah(id) {
  history.pushState({ view: 'reader', id }, '', `#surah-${id}`);
  showReader(id);
}

function updateMarkBtn() {
  const b = $('markBtn'), done = memorized.has(currentId);
  b.textContent = done ? 'إلغاء الحفظ' : 'تم الحفظ ✓';
  b.className = 'btn ' + (done ? 'undo' : 'primary');
}

async function showReader(id) {
  currentId = id;
  const token = ++loadToken;
  const name = SURAHS[id - 1];
  $('mainView').style.display = 'none';
  $('readerView').style.display = 'block';
  $('readerTitle').textContent = 'سورة ' + name;
  $('bannerName').textContent = 'سورة ' + name;
  $('bannerMeta').textContent = `${ar(id)} · عدد آياتها ${ar(VERSES[id - 1])}`;
  $('prevBtn').disabled = id <= 1;
  $('nextBtn').disabled = id >= 114;
  updateMarkBtn();
  audioPrepare(id);
  window.scrollTo(0, 0);
  lastSurahId = id;
  if (TV.on) setTimeout(() => $('playBtn').focus(), 0);

  // البسملة: تُعرض مرة واحدة فقط في الأعلى، ولا تُعرض في التوبة، وفي الفاتحة تظهر كآية أولى
  $('bismillah').innerHTML = (id !== 1 && id !== 9) ? `<div class="bismillah">${BISMILLAH}</div>` : '';

  const v = $('verses');
  v.innerHTML = '<div class="loading"><div class="spinner"></div>جاري تحميل الآيات...</div>';
  try {
    const ayahs = await fetchSurah(id);
    if (token !== loadToken) return;      // تم الانتقال لسورة أخرى أثناء التحميل
    const frag = document.createDocumentFragment();
    ayahs.forEach(a => {
      frag.appendChild(document.createTextNode(a.t + ' '));
      const s = document.createElement('span');
      s.className = 'ayah-no'; s.textContent = ar(a.n);
      frag.appendChild(s);
      frag.appendChild(document.createTextNode(' '));
    });
    v.replaceChildren(frag);
  } catch (err) {
    if (token !== loadToken) return;
    v.innerHTML = '<div class="error">تعذّر تحميل الآيات.<br>تأكد من اتصالك بالإنترنت (يلزم في أول قراءة لكل سورة فقط).<br><button class="retry" id="retryBtn">إعادة المحاولة</button></div>';
    $('retryBtn').onclick = () => showReader(id);
  }
}

function showMain() {
  loadToken++;
  currentId = null;
  audioStop();
  $('readerView').style.display = 'none';
  $('mainView').style.display = 'block';
  window.scrollTo(0, 0);
  if (TV.on) setTimeout(() => {
    const row = lastSurahId && $('list').querySelector('.surah[data-id="' + lastSurahId + '"]');
    const f = row || $('list').querySelector('.surah');
    if (f) { f.focus(); f.scrollIntoView({ block: 'center' }); }
  }, 0);
}

function goTo(id) {
  if (id < 1 || id > 114) return;
  history.replaceState({ view: 'reader', id }, '', `#surah-${id}`);
  showReader(id);
}

$('backBtn').onclick = () => (history.state && history.state.view === 'reader') ? history.back() : (history.replaceState(null, '', location.pathname + location.search), showMain());
$('prevBtn').onclick = () => { resumeNext = !aud.paused; goTo(currentId - 1); };
$('nextBtn').onclick = () => { resumeNext = !aud.paused; goTo(currentId + 1); };
$('markBtn').onclick = () => toggle(currentId);

function applyFont() { document.documentElement.style.setProperty('--reader-size', fontSize + 'rem'); }
$('fontPlus').onclick = () => { fontSize = Math.min(3, +(fontSize + .15).toFixed(2)); applyFont(); store.set('readerFontSize', fontSize); };
$('fontMinus').onclick = () => { fontSize = Math.max(1.1, +(fontSize - .15).toFixed(2)); applyFont(); store.set('readerFontSize', fontSize); };
applyFont();

window.addEventListener('popstate', e => {
  if (e.state && e.state.view === 'reader') showReader(e.state.id); else showMain();
});

/* ================= زر الأعلى ================= */
window.addEventListener('scroll', () => { $('toTop').style.display = window.scrollY > 500 ? 'block' : 'none'; }, { passive: true });
$('toTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

/* ================= التثبيت (PWA) ================= */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let deferredPrompt = null;

function showInstallSheet(steps) {
  $('sheetSteps').innerHTML = steps.map(s => `<li>${s}</li>`).join('');
  $('sheetBg').classList.add('open');
}
const closeSheet = () => $('sheetBg').classList.remove('open');
$('sheetClose').onclick = closeSheet;
$('sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone()) $('installBtn').style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  $('installBtn').style.display = 'none';
  toast('تم تثبيت التطبيق بنجاح 🎉');
});

$('installBtn').onclick = async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) {}
    deferredPrompt = null;
    $('installBtn').style.display = 'none';
    return;
  }
  if (isIOS) {
    showInstallSheet([
      'اضغط زر المشاركة <b>⬆︎</b> في أسفل المتصفح (Safari)',
      'مرّر للأسفل واختر <b>«إضافة إلى الشاشة الرئيسية»</b>',
      'اضغط <b>«إضافة»</b> وسيظهر التطبيق بأيقونته على شاشتك'
    ]);
  } else {
    showInstallSheet([
      'افتح قائمة المتصفح <b>⋮</b>',
      'اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>',
      'أكّد الإضافة وسيظهر التطبيق بأيقونته على شاشتك'
    ]);
  }
};

// iOS لا يدعم beforeinstallprompt: نُظهر الزر يدويًا إذا لم يكن التطبيق مثبّتًا
if (isIOS && !isStandalone()) $('installBtn').style.display = 'flex';

/* ================= وضع التلفاز: التحكم بالريموت ================= */
function detectTV() {
  const q = new URLSearchParams(location.search);
  if (q.get('tv') === '1') return true;
  if (q.get('tv') === '0') return false;
  const saved = store.get('tvMode', null);
  if (saved !== null) return !!saved;
  const ua = navigator.userAgent;
  if (/SMART-TV|SmartTV|Tizen|Web0S|WebOS|CrKey|BRAVIA|AFT[A-Z]|Android.*\bTV\b|Television|HbbTV|NetCast|AquosBrowser|Roku/i.test(ua)) return true;
  // أندرويد بدون شاشة لمس غالبًا تلفاز
  if (/Android/i.test(ua) && !('ontouchstart' in window) && !(navigator.maxTouchPoints > 0)) return true;
  return false;
}

function setTV(on, persist) {
  TV.on = on;
  document.documentElement.classList.toggle('tv', on);
  if (persist) store.set('tvMode', on);
  $('tvToggle').textContent = '📺 وضع التلفاز: ' + (on ? 'مفعّل' : 'متوقف');
  $('tvToggle').classList.toggle('sel', on);
  if (on) $('verses').setAttribute('tabindex', '0'); else $('verses').removeAttribute('tabindex');
}
$('tvToggle').onclick = () => { setTV(!TV.on, true); toast(TV.on ? 'تم تفعيل وضع التلفاز' : 'تم إيقاف وضع التلفاز'); };

function focusables() {
  const scope = document.querySelector('.sheet-bg.open') || document.body;
  return [...scope.querySelectorAll('button:not(:disabled),input,[tabindex="0"]')].filter(el => {
    if (el.getAttribute('tabindex') === '-1') return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
}
function focusEl(el) { el.focus(); el.scrollIntoView({ block: 'center' }); }

function moveFocus(dir) {
  const all = focusables();
  const cur = document.activeElement;
  if (!cur || !all.includes(cur)) { if (all[0]) focusEl(all[0]); return; }
  const a = cur.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of all) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect();
    const dx = r.left + r.width / 2 - ax, dy = r.top + r.height / 2 - ay;
    let main, cross;
    if (dir === 'left')  { if (dx >= -4) continue; main = -dx; cross = Math.abs(dy); }
    if (dir === 'right') { if (dx <= 4)  continue; main = dx;  cross = Math.abs(dy); }
    if (dir === 'up')    { if (dy >= -4) continue; main = -dy; cross = Math.abs(dx); }
    if (dir === 'down')  { if (dy <= 4)  continue; main = dy;  cross = Math.abs(dx); }
    const score = main + cross * 2.5;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) focusEl(best);
  else if (dir === 'up' || dir === 'down') window.scrollBy({ top: dir === 'down' ? 260 : -260 });
}

function tvBack() {
  if ($('setBg').classList.contains('open')) { closeSettings(); return true; }
  if ($('sheetBg').classList.contains('open')) { closeSheet(); return true; }
  if (currentId) { $('backBtn').click(); return true; }
  return false;
}
function seekBy(sec) {
  if (!aud.duration || !isFinite(aud.duration)) return;
  aud.currentTime = Math.max(0, Math.min(aud.duration, aud.currentTime + sec));
}

document.addEventListener('keydown', e => {
  if (!TV.on) return;
  const k = e.key, kc = e.keyCode, ae = document.activeElement;
  const inText = ae && ae.tagName === 'INPUT' && ae.type !== 'range';

  /* أزرار الوسائط في الريموت */
  if (k === 'MediaPlayPause' || kc === 179) { if (currentId) { e.preventDefault(); $('playBtn').click(); } return; }
  if (k === 'MediaPlay') { if (currentId && aud.paused) { e.preventDefault(); $('playBtn').click(); } return; }
  if (k === 'MediaPause') { if (currentId && !aud.paused) { e.preventDefault(); aud.pause(); } return; }
  if (k === 'MediaTrackNext' || kc === 176) { if (currentId && currentId < 114) { e.preventDefault(); goAudio(1); } return; }
  if (k === 'MediaTrackPrevious' || kc === 177) { if (currentId && currentId > 1) { e.preventDefault(); goAudio(-1); } return; }
  if (k === 'MediaFastForward') { e.preventDefault(); seekBy(10); return; }
  if (k === 'MediaRewind') { e.preventDefault(); seekBy(-10); return; }

  /* زر الرجوع */
  if (k === 'Escape' || k === 'GoBack' || k === 'BrowserBack' || kc === 4 || (k === 'Backspace' && !inText)) {
    if (inText && k === 'Escape') { ae.blur(); e.preventDefault(); return; }
    if (tvBack()) e.preventDefault();
    return;
  }

  /* الأسهم */
  const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  const dir = dirs[k];
  if (!dir) return;

  if (inText && (dir === 'left' || dir === 'right')) return;   // تحريك المؤشر داخل مربع البحث

  if (ae === $('seek') && (dir === 'left' || dir === 'right')) {
    e.preventDefault();
    seekBy(dir === 'left' ? 10 : -10);   // الاتجاه من اليمين لليسار
    return;
  }
  if (ae === $('verses') && (dir === 'up' || dir === 'down')) {
    e.preventDefault();
    const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8;
    const atTop = $('verses').getBoundingClientRect().top >= 0;
    if (dir === 'down' && !atBottom) { window.scrollBy({ top: 320 }); return; }
    if (dir === 'up' && !atTop) { window.scrollBy({ top: -320 }); return; }
  }
  e.preventDefault();
  moveFocus(dir);
});

/* الضغط على OK فوق شريط التقدم يشغّل/يوقف الصوت */
$('seek').addEventListener('keydown', e => {
  if (TV.on && e.key === 'Enter') { e.preventDefault(); $('playBtn').click(); }
});

/* ================= الإقلاع ================= */
setTV(detectTV(), false);
renderStats();
renderList();
if (TV.on) setTimeout(() => {
  if (!currentId) { const f = $('list').querySelector('.surah'); if (f) f.focus(); }
}, 350);
(function initFromHash() {
  const m = location.hash.match(/^#surah-(\d{1,3})$/);
  if (m) {
    const id = +m[1];
    if (id >= 1 && id <= 114) {
      history.replaceState({ view: 'reader', id }, '', `#surah-${id}`);
      showReader(id);
    }
  }
})();

})();
</script>
